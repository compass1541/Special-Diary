<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Diary</title>
    <meta name="description" content="AI 기반 스마트 일기장 - 당신의 일상을 기록하고 AI와 함께 탐색하세요">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">Special Diary</h1>
                <p class="app-subtitle">AI와 함께하는 일기</p>
            </div>

            <!-- User Auth Section -->
            <div class="auth-section" id="authSection">
                <!-- Logged Out State -->
                <div class="auth-logged-out" id="authLoggedOut">
                    <button class="auth-btn login-btn" id="openAuthModal">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10,17 15,12 10,7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        <span>로그인 / 회원가입</span>
                    </button>
                    <p class="auth-note">로컬 저장소 사용 중</p>
                </div>
                <!-- Logged In State -->
                <div class="auth-logged-in" id="authLoggedIn" style="display: none;">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <div class="user-details">
                            <span class="user-email" id="userEmail">user@example.com</span>
                            <span class="sync-status" id="syncStatus">☁️ 클라우드 동기화</span>
                        </div>
                    </div>
                    <button class="auth-btn logout-btn" id="logoutBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16,17 21,12 16,7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- AI Search -->
            <div class="ai-search-container">
                <button class="ai-search-btn" id="openAiSearch">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <span>AI로 일기 검색...</span>
                </button>
            </div>

            <!-- Calendar Mini -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="calendar-nav" id="prevMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                    </button>
                    <span class="calendar-title" id="calendarTitle">2026년 1월</span>
                    <button class="calendar-nav" id="nextMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar days will be rendered here -->
                </div>
            </div>

            <!-- Recent Entries -->
            <div class="entries-section">
                <h3 class="section-title">최근 일기</h3>
                <div class="entries-list" id="entriesList">
                    <!-- Entries will be rendered here -->
                </div>
            </div>

            <!-- New Entry Button -->
            <button class="new-entry-btn" id="newEntryBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                <span>오늘 일기 쓰기</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="editor-container" id="editorContainer">
                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h2>일기를 선택하거나 새로 작성하세요</h2>
                    <p>왼쪽 달력에서 날짜를 선택하거나<br>"오늘 일기 쓰기" 버튼을 클릭하세요</p>
                </div>

                <!-- Editor -->
                <div class="editor" id="editor" style="display: none;">
                    <div class="editor-header">
                        <div class="editor-date" id="editorDate">
                            <span class="date-day">27</span>
                            <div class="date-info">
                                <span class="date-weekday">월요일</span>
                                <span class="date-full">2026년 1월 27일</span>
                                <span class="written-time" id="writtenTime"></span>
                            </div>
                        </div>
                        <div class="editor-actions">
                            <button class="action-btn ai-suggest-btn" id="aiSuggestBtn" title="AI 제안">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                                    <path d="m2 17 10 5 10-5"></path>
                                    <path d="m2 12 10 5 10-5"></path>
                                </svg>
                            </button>
                            <button class="action-btn save-btn" id="saveBtn" title="저장">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                    <polyline points="17,21 17,13 7,13 7,21"></polyline>
                                    <polyline points="7,3 7,8 15,8"></polyline>
                                </svg>
                            </button>
                            <button class="action-btn delete-btn" id="deleteBtn" title="삭제">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="editor-body">
                        <textarea class="diary-content" id="diaryContent"
                            placeholder="오늘 하루는 어땠나요? 자유롭게 적어보세요..."></textarea>
                    </div>

                    <div class="editor-footer">
                        <div class="daily-comment-section">
                            <label class="comment-label">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                                오늘의 한 줄
                            </label>
                            <input type="text" class="daily-comment-input" id="dailyComment"
                                placeholder="오늘 하루를 한 줄로 요약하면?" maxlength="100">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- AI Search Modal -->
    <div class="modal-overlay" id="aiSearchModal">
        <div class="modal">
            <div class="modal-header">
                <h2>AI 검색</h2>
                <button class="modal-close" id="closeAiSearch">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="ai-search-input-container">
                    <input type="text" class="ai-search-input" id="aiSearchInput"
                        placeholder="예: 지난주에 운동한 날 찾아줘, 행복했던 날들 보여줘">
                    <button class="ai-search-submit" id="aiSearchSubmit">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="m22 2-7 20-4-9-9-4 20-7z"></path>
                            <path d="m22 2-11 11"></path>
                        </svg>
                    </button>
                </div>
                <div class="ai-search-results" id="aiSearchResults">
                    <!-- Search results will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- AI Suggestion Modal -->
    <div class="modal-overlay" id="aiSuggestionModal">
        <div class="modal suggestion-modal">
            <div class="modal-header">
                <h2>AI 제안</h2>
                <button class="modal-close" id="closeAiSuggestion">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="ai-suggestion-content" id="aiSuggestionContent">
                    <!-- AI suggestions will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal auth-modal">
            <div class="modal-header">
                <h2 id="authModalTitle">로그인</h2>
                <button class="modal-close" id="closeAuthModal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6 6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Auth Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="loginTab" data-tab="login">로그인</button>
                    <button class="auth-tab" id="signupTab" data-tab="signup">회원가입</button>
                </div>

                <!-- Login Form -->
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">이메일</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>
                        <input type="password" id="loginPassword" placeholder="비밀번호" required minlength="6">
                    </div>
                    <button type="submit" class="auth-submit-btn" id="loginSubmit">로그인</button>
                </form>

                <!-- Signup Form -->
                <form class="auth-form" id="signupForm" style="display: none;">
                    <div class="form-group">
                        <label for="signupEmail">이메일</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">비밀번호</label>
                        <input type="password" id="signupPassword" placeholder="6자 이상" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">비밀번호 확인</label>
                        <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 확인" required minlength="6">
                    </div>
                    <button type="submit" class="auth-submit-btn" id="signupSubmit">회원가입</button>
                </form>

                <!-- Auth Error Message -->
                <div class="auth-error" id="authError" style="display: none;"></div>

                <!-- Sync Option -->
                <div class="sync-option" id="syncOption" style="display: none;">
                    <p>로컬에 저장된 일기가 있습니다. 클라우드로 동기화하시겠습니까?</p>
                    <div class="sync-buttons">
                        <button class="sync-btn" id="syncYes">동기화</button>
                        <button class="sync-btn secondary" id="syncNo">나중에</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span class="toast-message" id="toastMessage"></span>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
